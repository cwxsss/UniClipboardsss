<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UniClipboard 管理</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section id="loginView" class="panel login-panel">
        <h1>UniClipboard 管理</h1>
        <form id="loginForm" class="form">
          <label>
            管理密码
            <input id="adminPassword" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">登录</button>
        </form>
      </section>

      <section id="appView" class="hidden">
        <header class="topbar">
          <div>
            <h1>UniClipboard 管理</h1>
            <p id="statusText">正在读取状态</p>
          </div>
          <div class="actions">
            <button id="refreshButton" type="button">刷新</button>
            <button id="logoutButton" type="button" class="ghost">退出</button>
          </div>
        </header>

        <div id="message" class="message hidden"></div>

        <section class="grid">
          <form id="createForm" class="panel form">
            <h2>生成连接信息</h2>
            <label>
              设备名称
              <input id="deviceLabel" type="text" placeholder="例如 iPhone 15" required />
            </label>
            <label>
              自定义账号
              <input id="deviceUsername" type="text" placeholder="留空自动生成" />
            </label>
            <label>
              自定义密码
              <input id="devicePassword" type="text" placeholder="留空自动生成" />
            </label>
            <button type="submit">生成二维码和账号密码</button>
          </form>

          <section id="resultPanel" class="panel hidden">
            <h2>连接信息</h2>
            <div class="qr-row">
              <div>
                <h3>连接二维码</h3>
                <img id="connectQr" alt="连接二维码" />
              </div>
              <div>
                <h3>快捷指令二维码</h3>
                <img id="installQr" alt="快捷指令二维码" />
              </div>
            </div>
            <dl class="kv">
              <dt>地址</dt>
              <dd><code id="baseUrl"></code><button data-copy="baseUrl" type="button">复制</button></dd>
              <dt>账号</dt>
              <dd><code id="username"></code><button data-copy="username" type="button">复制</button></dd>
              <dt>一次性密码</dt>
              <dd><code id="password"></code><button data-copy="password" type="button">复制</button></dd>
            </dl>
            <p class="hint">一次性密码只会在本次生成结果中显示。</p>
          </section>
        </section>

        <section id="desktopInvitePanel" class="desktop-invite">
          <form id="desktopInviteForm" class="panel form">
            <h2>桌面端连接</h2>
            <label>
              设备名称
              <input id="desktopDeviceName" type="text" placeholder="例如 Windows PC" />
            </label>
            <label>
              自定义邀请码
              <input id="desktopCustomCode" type="text" placeholder="留空随机生成" />
            </label>
            <label>
              空间口令
              <input id="desktopPassphrase" type="text" placeholder="留空后在桌面端手动输入" />
            </label>
            <button id="createDesktopInviteButton" type="submit">生成桌面端邀请</button>
          </form>

          <section id="desktopInviteResult" class="panel hidden">
            <div id="harmonyInviteBlock" class="harmony-invite hidden">
              <h3>鸿蒙端加入空间二维码</h3>
              <img id="harmonyInviteQr" alt="鸿蒙端加入空间二维码" />
              <p class="hint">鸿蒙客户端进入“设置 - 加入空间”后扫码。</p>
            </div>
            <p id="harmonyInviteMissing" class="hint hidden">需要填写空间口令后才会生成鸿蒙端二维码。</p>
            <h2>桌面端连接信息</h2>
            <dl class="kv">
              <dt>邀请码</dt>
              <dd><code id="desktopInviteCode"></code><button data-copy="desktopInviteCode" type="button">复制</button></dd>
              <dt>鸿蒙链接</dt>
              <dd><code id="harmonyJoinUri"></code><button data-copy="harmonyJoinUri" type="button">复制</button></dd>
              <dt>加入命令</dt>
              <dd><code id="desktopJoinCommand"></code><button data-copy="desktopJoinCommand" type="button">复制</button></dd>
              <dt>空间口令</dt>
              <dd><code id="desktopPassphraseState"></code></dd>
            </dl>
            <p class="hint">邀请码生成后请尽快在桌面端执行加入命令。生成新邀请会替换旧邀请。</p>
          </section>
        </section>

        <section class="panel">
          <div class="section-title">
            <h2>已登记设备</h2>
            <span id="deviceCount">0 台</span>
          </div>
          <div id="devices" class="devices"></div>
        </section>
      </section>
    </main>
    <script src="/lib/qrcode-generator-1.4.4.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
