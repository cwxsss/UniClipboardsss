services:
  relay:
    image: ${IROH_RELAY_IMAGE:-uniclipboard-iroh-relay:1.0.0-rc.1}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        IROH_RELAY_VERSION: ${IROH_RELAY_VERSION:-1.0.0-rc.1}
    restart: unless-stopped
    command: ["--config-path", "/etc/iroh-relay/config.toml"]
    ports:
      - "${IROH_HTTP_PORT:-80}:80/tcp"
      - "${IROH_HTTPS_PORT:-443}:443/tcp"
      - "${IROH_QUIC_PORT:-7842}:7842/udp"
    volumes:
      - ./config.toml:/etc/iroh-relay/config.toml:ro
      - relay-certs:/var/lib/iroh-relay/certs
    environment:
      RUST_LOG: ${RUST_LOG:-info,iroh_relay=debug}

volumes:
  relay-certs:
