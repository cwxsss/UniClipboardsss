name: 'Security Audit'
run-name: 'Dependency vulnerability audit'

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'crates/**/Cargo.toml'
      - 'apps/**/Cargo.toml'
      - 'src-tauri/**/Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/audit.toml'
      - 'package.json'
      - 'bun.lock'
      - 'docs-site/package.json'
      - 'docs-site/bun.lock'
      - 'workers/update-server/package.json'
      - 'workers/update-server/bun.lock'
      - '.github/workflows/security-audit.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'Cargo.toml'
      - 'crates/**/Cargo.toml'
      - 'apps/**/Cargo.toml'
      - 'src-tauri/**/Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/audit.toml'
      - 'package.json'
      - 'bun.lock'
      - 'docs-site/package.json'
      - 'docs-site/bun.lock'
      - 'workers/update-server/package.json'
      - 'workers/update-server/bun.lock'
      - '.github/workflows/security-audit.yml'
  schedule:
    # Catches newly-published RustSec/npm advisories against an unchanged
    # lockfile — the whole point of running this daily rather than only on
    # PRs that happen to touch dependencies. rustsec/audit-check detects the
    # `schedule` event and files a GitHub issue per new advisory instead of
    # failing a check (there's no PR/commit to attach a check to).
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install cargo-audit from its locked dependency set
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit --file Cargo.lock

  bun-audit:
    name: bun audit (${{ matrix.project.directory }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project:
          - directory: '.'
            name: root
            # The latest React Router release (7.18.2) is still affected;
            # the advisory is fixed in the not-yet-published 8.3.0 release.
            # Remove this exception as soon as that fixed release is available.
            ignore: '--ignore=GHSA-qwww-vcr4-c8h2'
          - directory: 'docs-site'
            name: docs-site
            # These are transitive dependencies without an upstream release
            # that resolves the advisory yet (Mermaid, Next, and
            # fumadocs-openapi). Remove an entry once its upstream release
            # makes `bun audit --production` clean.
            ignore: >-
              --ignore=GHSA-c2j3-45gr-mqc4
              --ignore=GHSA-cmwh-pvxp-8882
              --ignore=GHSA-vxr8-fq34-vvx9
              --ignore=GHSA-qx2v-qp2m-jg93
              --ignore=GHSA-6g55-p6wh-862q
              --ignore=GHSA-r28c-9q8g-f849
              --ignore=GHSA-f88m-g3jw-g9cj
          - directory: 'workers/update-server'
            name: update-server
            ignore: ''

    defaults:
      run:
        working-directory: ${{ matrix.project.directory }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `--production` scopes the gate to what actually ships (runtime
      # dependencies). Dev tooling (vite, vitest, eslint, wdio, ...) has its
      # own, much noisier advisory surface that never reaches a build
      # artifact — gating on it would fail CI on unrelated tooling churn
      # instead of on dependencies that could ship a known vulnerability.
      - name: Audit production dependencies
        run: bun audit --production ${{ matrix.project.ignore }}
