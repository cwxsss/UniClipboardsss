name: 'Build server image to Docker Hub'
run-name: "build-server-image-${{ inputs.target_tag }}-${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: 'Base image to wrap'
        required: true
        type: string
        default: 'ghcr.io/uniclipboard/uniclipboard-server:0.20.0-alpha.2'
      target_repo:
        description: 'Docker Hub repository'
        required: true
        type: string
        default: 'chuais/uniclipboard-server'
      target_tag:
        description: 'Docker Hub version tag'
        required: true
        type: string
        default: '0.20.0-alpha.2'
      push_latest:
        description: 'Also push latest'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'chuais' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Docker tags
        id: docker_tags
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_TAG: ${{ inputs.target_tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          {
            echo 'tags<<EOF'
            echo "${TARGET_REPO}:${TARGET_TAG}"
            if [[ "${PUSH_LATEST}" == "true" ]]; then
              echo "${TARGET_REPO}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Synology-friendly image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/synology/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ inputs.source_image }}
          tags: ${{ steps.docker_tags.outputs.tags }}

      - name: Inspect mirrored image
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: docker buildx imagetools inspect "${TARGET_REPO}:${TARGET_TAG}"

      - name: Summary
        env:
          SOURCE_IMAGE: ${{ inputs.source_image }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_TAG: ${{ inputs.target_tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          {
            echo "## Docker Hub image pushed"
            echo ""
            echo "Source:"
            echo '```'
            echo "${SOURCE_IMAGE}"
            echo '```'
            echo "Target:"
            echo '```'
            echo "${TARGET_REPO}:${TARGET_TAG}"
            if [[ "${PUSH_LATEST}" == "true" ]]; then
              echo "${TARGET_REPO}:latest"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
