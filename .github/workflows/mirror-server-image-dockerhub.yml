name: 'Mirror server image to Docker Hub'
run-name: "mirror-server-image-${{ inputs.target_tag }}-${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: 'Source image to mirror'
        required: true
        type: string
        default: 'ghcr.io/uniclipboard/uniclipboard-server:0.20.0-alpha.2'
      target_repo:
        description: 'Docker Hub repository'
        required: true
        type: string
        default: 'chuais/uniclipboard-server'
      target_tag:
        description: 'Docker Hub version tag'
        required: true
        type: string
        default: '0.20.0-alpha.2'
      push_latest:
        description: 'Also push latest'
        required: true
        type: boolean
        default: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'chuais' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror multi-arch image
        env:
          SOURCE_IMAGE: ${{ inputs.source_image }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_TAG: ${{ inputs.target_tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail

          tags=(-t "${TARGET_REPO}:${TARGET_TAG}")
          if [[ "${PUSH_LATEST}" == "true" ]]; then
            tags+=(-t "${TARGET_REPO}:latest")
          fi

          docker buildx imagetools create "${tags[@]}" "${SOURCE_IMAGE}"

      - name: Inspect mirrored image
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: docker buildx imagetools inspect "${TARGET_REPO}:${TARGET_TAG}"

      - name: Summary
        env:
          SOURCE_IMAGE: ${{ inputs.source_image }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_TAG: ${{ inputs.target_tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          {
            echo "## Docker Hub mirror pushed"
            echo ""
            echo "Source:"
            echo '```'
            echo "${SOURCE_IMAGE}"
            echo '```'
            echo "Target:"
            echo '```'
            echo "${TARGET_REPO}:${TARGET_TAG}"
            if [[ "${PUSH_LATEST}" == "true" ]]; then
              echo "${TARGET_REPO}:latest"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
